      <text x="0" y="40" font-size="12" font-weight="400" fill="#9CA3AF">Real-time local neural engine processing multiple field sensor and camera feeds</text>

      <!-- 4 Quick Metric Cards -->
      <g transform="translate(0, 56)">
        <!-- Metric 1 -->
        <rect x="0" y="0" width="205" height="80" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <text x="18" y="26" font-size="11" font-weight="600" fill="#9CA3AF">TOTAL CROPS SCANNED</text>
        <text x="18" y="56" font-size="24" font-weight="800" fill="#FFFFFF">1,482</text>
        <text x="18" y="72" font-size="10" font-weight="600" fill="#34D399">+14% vs last week</text>

        <!-- Metric 2 -->
        <rect x="220" y="0" width="205" height="80" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <text x="238" y="26" font-size="11" font-weight="600" fill="#9CA3AF">CROP HEALTH RATE</text>
        <text x="238" y="56" font-size="24" font-weight="800" fill="#34D399">92.4%</text>
        <text x="238" y="72" font-size="10" font-weight="600" fill="#6EE7B7">137 healthy clusters</text>

        <!-- Metric 3 -->
        <rect x="440" y="0" width="205" height="80" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <text x="458" y="26" font-size="11" font-weight="600" fill="#9CA3AF">OFFLINE AI ENGINE</text>
        <text x="458" y="56" font-size="22" font-weight="800" fill="#60A5FA">ACTIVE</text>
        <text x="458" y="72" font-size="10" font-weight="600" fill="#93C5FD">MobileNetV3 + ResNet50</text>

        <!-- Metric 4 -->
        <rect x="660" y="0" width="195" height="80" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <text x="678" y="26" font-size="11" font-weight="600" fill="#9CA3AF">TUNNEL LATENCY</text>
        <text x="678" y="56" font-size="24" font-weight="800" fill="#F59E0B">18ms</text>
        <text x="678" y="72" font-size="10" font-weight="600" fill="#FBBF24">Bengaluru Cloudflare</text>
      </g>

      <!-- Multi-Stream Camera & Batch Viewport -->
      <g transform="translate(0, 154)">
        <rect width="855" height="380" rx="16" fill="#0A140F" stroke="rgba(16,185,129,0.25)" stroke-width="1.5"/>
        
        <!-- Stream 1: Main Camera -->
        <g transform="translate(20, 20)">
