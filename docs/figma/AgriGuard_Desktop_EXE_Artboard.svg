<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" style="background:#080D0B; font-family:'Inter', -apple-system, sans-serif;">
  <defs>
    <linearGradient id="deskBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1510"/>
      <stop offset="100%" stop-color="#050907"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1F17"/>
      <stop offset="100%" stop-color="#09130E"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Desktop App Window Frame -->
  <rect width="1440" height="900" rx="16" fill="url(#deskBg)"/>
  <rect width="1438" height="898" x="1" y="1" rx="15" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Native Windows 11 Titlebar -->
  <g>
    <rect width="1440" height="38" rx="16" fill="#0C1410"/>
    <!-- App Emblem & Title -->
    <rect x="14" y="9" width="20" height="20" rx="5" fill="url(#emeraldGrad)"/>
    <path d="M 24,13 C 27,15 28,19 26,23 C 25,24 24,25 24,25 C 24,25 23,22 24,19 Z" fill="#FFFFFF"/>
    <text x="44" y="24" font-size="12" font-weight="600" fill="#E5E7EB">AgriGuard AI — Professional Agricultural Diagnostic Station v2.4 (Laptop Server Mode)</text>

    <!-- Windows Caption Controls (Minimize, Maximize, Close) -->
    <g transform="translate(1335, 0)">
      <rect x="0" y="0" width="35" height="38" fill="transparent"/>
      <line x1="12" y1="20" x2="22" y2="20" stroke="#9CA3AF" stroke-width="1"/>
      
      <rect x="35" y="0" width="35" height="38" fill="transparent"/>
      <rect x="47" y="14" width="10" height="10" fill="none" stroke="#9CA3AF" stroke-width="1"/>

      <rect x="70" y="0" width="35" height="38" fill="transparent"/>
      <path d="M 82 14 L 92 24 M 92 14 L 82 24" stroke="#9CA3AF" stroke-width="1"/>
    </g>
  </g>

  <!-- Main Body Layout (Sidebar + Center Content + Right Telemetry) -->
  <g transform="translate(0, 38)">
    
    <!-- ─── 1. LEFT SIDEBAR (Width: 240) ─── -->
    <rect width="240" height="862" fill="#09120E" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    
    <!-- Sidebar Brand Header -->
    <g transform="translate(20, 24)">
      <rect width="32" height="32" rx="8" fill="url(#emeraldGrad)"/>
      <text x="42" y="22" font-size="16" font-weight="800" fill="#FFFFFF">AgriGuard</text>
      <text x="42" y="32" font-size="9.5" font-weight="700" fill="#34D399" letter-spacing="0.5">LOCAL HOST</text>
    </g>

    <!-- Sidebar Navigation Items -->
    <g transform="translate(16, 80)">
      <!-- Item 1: Dashboard (Active) -->
      <rect width="208" height="42" rx="10" fill="rgba(16,185,129,0.15)" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
      <text x="18" y="26" font-size="13" font-weight="600" fill="#34D399">📊 Dashboard Overview</text>

      <!-- Item 2: AI Scanner -->
      <g transform="translate(0, 48)">
        <rect width="208" height="42" rx="10" fill="transparent"/>
        <text x="18" y="26" font-size="13" font-weight="500" fill="#9CA3AF">🔬 Batch AI Scanner</text>
      </g>

      <!-- Item 3: Crop Health History -->
      <g transform="translate(0, 96)">
        <rect width="208" height="42" rx="10" fill="transparent"/>
        <text x="18" y="26" font-size="13" font-weight="500" fill="#9CA3AF">📜 Crop Health Records</text>
      </g>

      <!-- Item 4: Compare -->
      <g transform="translate(0, 144)">
        <rect width="208" height="42" rx="10" fill="transparent"/>
        <text x="18" y="26" font-size="13" font-weight="500" fill="#9CA3AF">⚖️ Comparative Progression</text>
      </g>

      <!-- Item 5: IoT Sensors -->
      <g transform="translate(0, 192)">
        <rect width="208" height="42" rx="10" fill="transparent"/>
        <text x="18" y="26" font-size="13" font-weight="500" fill="#9CA3AF">📡 IoT Field Nodes</text>
      </g>
    </g>

    <!-- Sidebar Multi-Tenant Profile Box (Bottom) -->
    <g transform="translate(16, 760)">
      <rect width="208" height="78" rx="12" fill="#0D1A14" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
      <circle cx="28" cy="28" r="14" fill="url(#emeraldGrad)"/>
      <text x="28" y="32" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">L</text>
      <text x="48" y="24" font-size="12" font-weight="700" fill="#FFFFFF">lohit (Admin)</text>
      <text x="48" y="38" font-size="10" font-weight="500" fill="#10B981">Multi-tenant: user &lt; data</text>
      
      <rect x="14" y="52" width="180" height="18" rx="4" fill="rgba(0,0,0,0.3)"/>
      <text x="20" y="64" font-size="9" font-family="monospace" fill="#9CA3AF">Storage: C:\AgriGuard\data\lohit</text>
    </g>

    <!-- ─── 2. CENTRAL WORKSPACE (X: 240, Width: 880) ─── -->
    <g transform="translate(260, 20)">
      <!-- Top Workspace Bar -->
