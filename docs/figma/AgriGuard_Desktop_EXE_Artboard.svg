          <text x="186" y="105" font-size="11" font-weight="700" fill="#FFFFFF">Tomato: Late Blight (94%)</text>

          <text x="20" y="30" font-size="12" font-weight="700" fill="#FFFFFF">📹 Feed 01: Polyhouse North Section</text>
          <text x="20" y="325" font-size="11" font-weight="600" fill="#34D399">Visible damage: 32% (AI estimate) • Low confidence filter active</text>
        </g>

        <!-- Secondary Batch Feeds (Right of Stream) -->
        <g transform="translate(560, 20)">
          <!-- Feed 2: Potato -->
          <rect width="275" height="160" rx="10" fill="#08100C" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
          <rect x="15" y="15" width="245" height="100" rx="6" fill="#0F1F17"/>
          <text x="20" y="135" font-size="11" font-weight="700" fill="#FFFFFF">🥔 Potato Field Bed C</text>
          <text x="20" y="150" font-size="10" font-weight="600" fill="#34D399">Status: Confirmed Healthy (98%)</text>

          <!-- Feed 3: Chilli -->
          <g transform="translate(0, 180)">
            <rect width="275" height="160" rx="10" fill="#08100C" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
            <rect x="15" y="15" width="245" height="100" rx="6" fill="#0F1F17"/>
            <text x="20" y="135" font-size="11" font-weight="700" fill="#FFFFFF">🌶️ Chilli Greenhouse Row 4</text>
            <text x="20" y="150" font-size="10" font-weight="600" fill="#F59E0B">Status: Mild Leaf Curl (71%)</text>
          </g>
        </g>
      </g>

      <!-- Recent Diagnostics Table -->
      <g transform="translate(0, 552)">
        <rect width="855" height="280" rx="16" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <text x="24" y="34" font-size="14" font-weight="700" fill="#FFFFFF">Active Field Health Logs &amp; Auto-Detected Crops</text>
        
        <!-- Table Header -->
        <rect x="24" y="50" width="807" height="30" rx="6" fill="rgba(0,0,0,0.3)"/>
        <text x="36" y="70" font-size="11" font-weight="700" fill="#9CA3AF">TIMESTAMP</text>
        <text x="180" y="70" font-size="11" font-weight="700" fill="#9CA3AF">DETECTED CROP</text>
        <text x="340" y="70" font-size="11" font-weight="700" fill="#9CA3AF">DIAGNOSIS</text>
        <text x="520" y="70" font-size="11" font-weight="700" fill="#9CA3AF">CONFIDENCE</text>
        <text x="680" y="70" font-size="11" font-weight="700" fill="#9CA3AF">DEVICE NODE</text>

        <!-- Row 1 -->
        <text x="36" y="105" font-size="11.5" font-family="monospace" fill="#E5E7EB">10:24:12 AM</text>
        <text x="180" y="105" font-size="12" font-weight="600" fill="#FFFFFF">🍅 Tomato</text>
        <text x="340" y="105" font-size="12" font-weight="600" fill="#F87171">Late Blight Detected</text>
        <text x="520" y="105" font-size="12" font-weight="700" fill="#34D399">94% (High)</text>
        <text x="680" y="105" font-size="11" fill="#9CA3AF">Mobile APK (lohit)</text>

        <!-- Row 2 -->
        <text x="36" y="145" font-size="11.5" font-family="monospace" fill="#E5E7EB">10:19:40 AM</text>
        <text x="180" y="145" font-size="12" font-weight="600" fill="#FFFFFF">🥔 Potato</text>
        <text x="340" y="145" font-size="12" font-weight="600" fill="#34D399">Healthy Foliage</text>
        <text x="520" y="145" font-size="12" font-weight="700" fill="#34D399">98% (High)</text>
        <text x="680" y="145" font-size="11" fill="#9CA3AF">Remote Phone (Friend)</text>

        <!-- Row 3 -->
        <text x="36" y="185" font-size="11.5" font-family="monospace" fill="#E5E7EB">09:55:18 AM</text>
        <text x="180" y="185" font-size="12" font-weight="600" fill="#FFFFFF">🌾 Rice</text>
        <text x="340" y="185" font-size="12" font-weight="600" fill="#FBBF24">Brown Spot Suspect</text>
        <text x="520" y="185" font-size="12" font-weight="700" fill="#9CA3AF">Low Confidence</text>
        <text x="680" y="185" font-size="11" fill="#9CA3AF">Desktop Workstation</text>
      </g>
    </g>

    <!-- ─── 3. RIGHT TELEMETRY & REPORT PANEL (Width: 300) ─── -->
    <g transform="translate(1135, 20)">
      <rect width="285" height="812" rx="16" fill="#09120E" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
      
      <!-- Panel Header -->
      <g transform="translate(20, 24)">
        <text x="0" y="16" font-size="14" font-weight="700" fill="#FFFFFF">🌐 Remote Cloudflare Sync</text>
        <text x="0" y="32" font-size="10.5" font-weight="500" fill="#9CA3AF">Laptop serving as 24/7 host</text>
        
        <!-- Tunnel Card -->
        <g transform="translate(0, 48)">
          <rect width="245" height="74" rx="10" fill="#0F1E17" stroke="rgba(16,185,129,0.3)" stroke-width="1"/>
          <circle cx="20" cy="22" r="5" fill="#34D399" filter="url(#glow)"/>
          <text x="32" y="26" font-size="12" font-weight="700" fill="#FFFFFF">Tunnel Active (4G/5G)</text>
          <text x="16" y="46" font-size="10" font-family="monospace" fill="#6EE7B7">https://agriguard-live.trycloudflare.com</text>
          <text x="16" y="62" font-size="9" font-weight="500" fill="#9CA3AF">Accessible anywhere without same Wi-Fi</text>
        </g>
