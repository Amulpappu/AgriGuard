      <!-- Connected Remote Clients -->
      <g transform="translate(20, 180)">
        <text x="0" y="16" font-size="12" font-weight="700" fill="#FFFFFF">📱 Connected User Devices</text>
        
        <!-- Device 1 -->
        <g transform="translate(0, 30)">
          <rect width="245" height="42" rx="8" fill="rgba(255,255,255,0.04)"/>
          <text x="14" y="26" font-size="11.5" font-weight="600" fill="#FFFFFF">📱 Xiaomi 12 Pro (lohit)</text>
          <text x="195" y="26" font-size="10" font-weight="700" fill="#34D399">ACTIVE</text>
        </g>

        <!-- Device 2 -->
        <g transform="translate(0, 80)">
          <rect width="245" height="42" rx="8" fill="rgba(255,255,255,0.04)"/>
          <text x="14" y="26" font-size="11.5" font-weight="600" fill="#FFFFFF">📱 Friend Phone (Remote)</text>
          <text x="195" y="26" font-size="10" font-weight="700" fill="#34D399">SYNCED</text>
        </g>

        <!-- Device 3 -->
        <g transform="translate(0, 130)">
          <rect width="245" height="42" rx="8" fill="rgba(255,255,255,0.04)"/>
          <text x="14" y="26" font-size="11.5" font-weight="600" fill="#FFFFFF">💻 Laptop Workstation</text>
          <text x="195" y="26" font-size="10" font-weight="700" fill="#60A5FA">SERVER</text>
        </g>
      </g>

      <!-- Soil & Weather Sensor Radar -->
      <g transform="translate(20, 380)">
        <text x="0" y="16" font-size="12" font-weight="700" fill="#FFFFFF">🌿 Field Environment Node</text>
        
        <g transform="translate(0, 30)">
          <rect width="245" height="150" rx="12" fill="#0D1A14" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
          
          <text x="16" y="30" font-size="11" font-weight="600" fill="#9CA3AF">SOIL N-P-K BALANCE</text>
          <text x="16" y="52" font-size="18" font-weight="800" fill="#34D399">42 - 18 - 35 mg/kg</text>

          <text x="16" y="85" font-size="11" font-weight="600" fill="#9CA3AF">SOIL MOISTURE</text>
          <text x="16" y="105" font-size="18" font-weight="800" fill="#60A5FA">64% (Optimal)</text>

          <text x="16" y="132" font-size="10" font-weight="500" fill="#6EE7B7">● IoT LoRa Node 04 Transmitting</text>
        </g>
