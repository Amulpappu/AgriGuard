        <rect width="245" height="48" rx="12" fill="url(#emeraldGrad)" filter="url(#glow)"/>
        <text x="122" y="29" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">📄 Generate PDF Advisory</text>
      </g>
