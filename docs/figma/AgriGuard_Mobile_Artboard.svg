<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="390" height="844" style="background:#080D0B; font-family:'Inter', -apple-system, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B1510"/>
      <stop offset="100%" stop-color="#050907"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#11221A"/>
      <stop offset="100%" stop-color="#0A1510"/>
    </linearGradient>
    <linearGradient id="laserGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Phone Background Frame -->
  <rect width="390" height="844" rx="44" fill="url(#bgGrad)"/>
  <rect width="388" height="842" x="1" y="1" rx="43" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1.5"/>

  <!-- Status Bar -->
  <g fill="#9CA3AF" font-size="12" font-weight="600">
    <text x="32" y="34" fill="#FFFFFF">9:41</text>
    <!-- Dynamic Island -->
    <rect x="135" y="11" width="120" height="28" rx="14" fill="#000000"/>
    <circle cx="232" cy="25" r="4.5" fill="#111827"/>
    <circle cx="232" cy="25" r="2" fill="#064E3B"/>
    <!-- Signal, Wifi, Battery -->
    <path d="M 326 24 L 329 27 L 332 24" stroke="#FFFFFF" stroke-width="1.5" fill="none"/>
    <rect x="340" y="22" width="20" height="10" rx="3" fill="none" stroke="#FFFFFF" stroke-width="1"/>
    <rect x="342" y="24" width="14" height="6" rx="1.5" fill="#10B981"/>
  </g>

  <!-- Top Navigation Header -->
  <g transform="translate(20, 56)">
    <!-- Logo Icon -->
    <rect width="36" height="36" rx="10" fill="url(#emeraldGrad)"/>
    <path d="M 18,10 C 24,14 26,20 22,26 C 20,28 18,29 18,29 C 18,29 17,25 18,20 Z" fill="#FFFFFF"/>
    <path d="M 18,10 C 13,14 11,20 15,26 C 16,28 18,29 18,29 C 18,29 19,25 18,20 Z" fill="#D1FAE5"/>
    
    <!-- Title -->
    <text x="46" y="23" font-size="17" font-weight="700" fill="#FFFFFF" letter-spacing="-0.3">AgriGuard AI</text>
    <text x="46" y="34" font-size="10" font-weight="500" fill="#10B981">Multi-Device Synchronized</text>

    <!-- Language Selector Pill -->
    <rect x="270" y="4" width="80" height="28" rx="14" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <text x="310" y="22" font-size="11" font-weight="600" fill="#E5E7EB" text-anchor="middle">தமிழ் | EN</text>
  </g>

  <!-- Real-Time Camera Scanner Viewport -->
  <g transform="translate(20, 114)">
    <rect width="350" height="240" rx="20" fill="#0A140F" stroke="rgba(16,185,129,0.3)" stroke-width="1.5"/>
    
    <!-- Viewfinder Plant Silhouette / Demo Photo Background -->
    <path d="M 175,50 C 230,80 250,150 200,210 C 185,225 175,230 175,230 C 175,230 165,225 150,210 C 100,150 120,80 175,50 Z" fill="rgba(16,185,129,0.15)"/>
    <path d="M 175,60 L 175,220" stroke="rgba(52,211,153,0.3)" stroke-width="2"/>

    <!-- Laser Scanning Line -->
    <rect x="20" y="110" width="310" height="2" fill="#34D399" filter="url(#glow)"/>
    <rect x="20" y="90" width="310" height="20" fill="url(#laserGrad)"/>

    <!-- Viewfinder Laser Corner Reticles -->
    <path d="M 25,45 L 25,25 L 45,25" stroke="#10B981" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 325,45 L 325,25 L 305,25" stroke="#10B981" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 25,195 L 25,215 L 45,215" stroke="#10B981" stroke-width="3" stroke-linecap="round" fill="none"/>
    <path d="M 325,195 L 325,215 L 305,215" stroke="#10B981" stroke-width="3" stroke-linecap="round" fill="none"/>

    <!-- AI Live Status Pill -->
    <rect x="16" y="16" width="118" height="24" rx="12" fill="rgba(0,0,0,0.65)" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
    <circle cx="28" cy="28" r="4" fill="#EF4444"/>
    <text x="38" y="32" font-size="10.5" font-weight="700" fill="#E5E7EB">AI LIVE SCAN</text>

    <!-- Crop Detection Tag inside Reticle -->
    <g transform="translate(75, 150)">
      <rect width="200" height="32" rx="8" fill="rgba(8,13,11,0.88)" stroke="#34D399" stroke-width="1.5" filter="url(#glow)"/>
      <text x="100" y="20" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">Tomato: Late Blight (94%)</text>
    </g>

    <!-- Shutter / Upload Bar -->
    <g transform="translate(145, 195)">
      <circle cx="30" cy="20" r="18" fill="#10B981" stroke="#FFFFFF" stroke-width="2.5" filter="url(#glow)"/>
      <circle cx="30" cy="20" r="14" fill="#059669"/>
    </g>
  </g>

  <!-- Auto-Detect Crop Card -->
  <g transform="translate(20, 368)">
    <rect width="350" height="64" rx="16" fill="url(#cardGrad)" stroke="rgba(52,211,153,0.25)" stroke-width="1"/>
    <text x="18" y="27" font-size="13.5" font-weight="700" fill="#FFFFFF">✨ Auto-Detect Any Crop / Vegetable</text>
    <text x="18" y="46" font-size="11" font-weight="400" fill="#9CA3AF">AI identifies crop category &amp; safe remedies automatically</text>
    
    <rect x="282" y="16" width="56" height="22" rx="6" fill="rgba(16,185,129,0.2)" stroke="rgba(16,185,129,0.4)" stroke-width="1"/>
    <text x="310" y="31" font-size="9" font-weight="800" fill="#34D399" text-anchor="middle">DEFAULT</text>
  </g>

  <!-- Supported Crop & Vegetable Horizontal Chips -->
  <g transform="translate(20, 446)">
    <text x="0" y="12" font-size="11.5" font-weight="600" fill="#9CA3AF">Supported Crops &amp; Vegetables (14+ Auto Detected):</text>
    
    <!-- Chip 1: Tomato -->
    <rect x="0" y="22" width="76" height="28" rx="8" fill="rgba(16,185,129,0.2)" stroke="#10B981" stroke-width="1"/>
    <text x="38" y="40" font-size="11" font-weight="600" fill="#34D399" text-anchor="middle">🍅 Tomato</text>

    <!-- Chip 2: Potato -->
    <rect x="84" y="22" width="76" height="28" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="122" y="40" font-size="11" font-weight="500" fill="#D1D5DB" text-anchor="middle">🥔 Potato</text>

    <!-- Chip 3: Chilli -->
    <rect x="168" y="22" width="70" height="28" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="203" y="40" font-size="11" font-weight="500" fill="#D1D5DB" text-anchor="middle">🌶️ Chilli</text>

    <!-- Chip 4: Rice -->
    <rect x="246" y="22" width="64" height="28" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="278" y="40" font-size="11" font-weight="500" fill="#D1D5DB" text-anchor="middle">🌾 Rice</text>

    <!-- Chip 5: Corn -->
    <rect x="318" y="22" width="32" height="28" rx="8" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
    <text x="334" y="40" font-size="11" font-weight="500" fill="#D1D5DB" text-anchor="middle">🌽</text>
  </g>

  <!-- Real-Time Field Telemetry Cards (Soil, Humidity, Health) -->
  <g transform="translate(20, 514)">
    <!-- Metric 1: Health Index -->
    <rect x="0" y="0" width="108" height="74" rx="14" fill="#0D1612" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="12" y="22" font-size="10" font-weight="600" fill="#9CA3AF">HEALTH INDEX</text>
    <text x="12" y="48" font-size="20" font-weight="800" fill="#34D399">88%</text>
    <text x="12" y="64" font-size="9" font-weight="500" fill="#6EE7B7">Good Standing</text>

    <!-- Metric 2: Moisture -->
    <rect x="121" y="0" width="108" height="74" rx="14" fill="#0D1612" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="133" y="22" font-size="10" font-weight="600" fill="#9CA3AF">SOIL MOISTURE</text>
    <text x="133" y="48" font-size="20" font-weight="800" fill="#60A5FA">64%</text>
    <text x="133" y="64" font-size="9" font-weight="500" fill="#93C5FD">Optimal Range</text>

    <!-- Metric 3: Multi-tenant Sync -->
    <rect x="242" y="0" width="108" height="74" rx="14" fill="#0D1612" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="254" y="22" font-size="10" font-weight="600" fill="#9CA3AF">LAPTOP SYNC</text>
    <text x="254" y="48" font-size="18" font-weight="800" fill="#F59E0B">24ms</text>
    <text x="254" y="64" font-size="9" font-weight="500" fill="#FBBF24">Online (Tunnel)</text>
  </g>

  <!-- Emergency Advisory Card -->
  <g transform="translate(20, 604)">
    <rect width="350" height="96" rx="16" fill="rgba(239,68,68,0.08)" stroke="rgba(239,68,68,0.3)" stroke-width="1.5"/>
    <circle cx="28" cy="28" r="10" fill="#EF4444"/>
    <text x="28" y="32" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">!</text>
    <text x="46" y="32" font-size="13.5" font-weight="700" fill="#F87171">Action Plan: Copper Spray Advisory</text>
    <text x="18" y="56" font-size="11" font-weight="400" fill="#D1D5DB">Visible damage: 32% (AI estimate). Apply copper fungicide.</text>
    <text x="18" y="74" font-size="10" font-weight="500" fill="#9CA3AF">Photo-based evaluation • Retake photo or consult local KVK.</text>
  </g>

  <!-- Floating Glass Bottom Navigation Bar -->
  <g transform="translate(16, 736)">
    <rect width="358" height="66" rx="22" fill="#0B130F" stroke="rgba(255,255,255,0.12)" stroke-width="1" filter="url(#glow)"/>
    
    <!-- Tab 1: Dashboard -->
    <g transform="translate(24, 16)">
      <rect x="6" y="4" width="16" height="16" rx="3" fill="none" stroke="#6B7280" stroke-width="2"/>
      <text x="14" y="36" font-size="9.5" font-weight="600" fill="#6B7280" text-anchor="middle">Home</text>
    </g>

    <!-- Tab 2: New Scan (Active Hero) -->
    <g transform="translate(98, 8)">
      <circle cx="20" cy="20" r="22" fill="url(#emeraldGrad)" filter="url(#glow)"/>
      <circle cx="20" cy="20" r="7" fill="none" stroke="#FFFFFF" stroke-width="2"/>
      <text x="20" y="46" font-size="9.5" font-weight="700" fill="#34D399" text-anchor="middle">Scan</text>
    </g>

    <!-- Tab 3: History -->
    <g transform="translate(180, 16)">
      <circle cx="14" cy="12" r="8" fill="none" stroke="#6B7280" stroke-width="2"/>
      <path d="M 14,8 L 14,12 L 18,14" stroke="#6B7280" stroke-width="1.5" fill="none"/>
      <text x="14" y="36" font-size="9.5" font-weight="600" fill="#6B7280" text-anchor="middle">History</text>
    </g>

    <!-- Tab 4: Compare -->
    <g transform="translate(248, 16)">
      <path d="M 6,10 L 22,10 M 18,6 L 22,10 L 18,14" stroke="#6B7280" stroke-width="1.8" fill="none"/>
      <text x="14" y="36" font-size="9.5" font-weight="600" fill="#6B7280" text-anchor="middle">Compare</text>
    </g>

    <!-- Tab 5: Field IoT -->
    <g transform="translate(310, 16)">
      <path d="M 6,16 C 10,12 18,12 22,16" stroke="#6B7280" stroke-width="2" fill="none"/>
      <circle cx="14" cy="18" r="2" fill="#6B7280"/>
      <text x="14" y="36" font-size="9.5" font-weight="600" fill="#6B7280" text-anchor="middle">Field</text>
    </g>
  </g>

  <!-- iPhone Home Indicator Bar -->
  <rect x="125" y="830" width="140" height="4" rx="2" fill="#FFFFFF" opacity="0.4"/>
</svg>
